services:
  strapi:
    container_name: strapi
    platform: linux/amd64
    build:
      context: .
    image: strapi:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - strapi

networks:
  strapi:
    name: strapi
